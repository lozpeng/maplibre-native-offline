[versions]
mapLibreServices = "6.0.1"
constraintLayout = "2.2.1"
interpolator = "1.0.0"
recyclerView = "1.3.0"
material = "1.13.0"
sentryAndroid = "8.51.0"
uiAutomator = "2.3.0"
espresso = "3.7.0"
testRunner = "1.3.0"
testRules = "1.7.0"
fragment = "1.8.9"
annotation = "1.8.2"
androidxPrint = "1.1.0"
leakCanary = "2.14"
junit = "4.13.2"
mockito = "5.23.0"
mockk = "1.14.9"
robolectric = "4.16.1"
timber = "5.0.1"
okhttp = "4.12.0"
kotlin = "2.3.20"
lint = "32.1.1"
appcenter = "1.5"
commonsIO = "2.21.0"
assertj = "3.27.7"
multidex = "2.0.1"
kotlinxCoroutines = "1.10.2"
androidServer = "1.3.3"

utilcode = '1.31.1'

[libraries]
# ---- Kotlin 协程 ----
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# ---- MapLibre ----
maplibre-geojson    = { group = "org.maplibre.gl", name = "android-sdk-geojson",       version.ref = "mapLibreServices" }
maplibre-gestures   = { group = "org.maplibre.gl", name = "maplibre-android-gestures", version = "0.0.4" }
maplibre-turf       = { group = "org.maplibre.gl", name = "android-sdk-turf",          version.ref = "mapLibreServices" }
maplibre-navigation = { group = "com.github.maplibre.maplibre-navigation-android", name = "libandroid-navigation", version = "4.0.0" }

# ---- AndroidX ----
support-annotations       = { group = "androidx.annotation",      name = "annotation",       version.ref = "annotation" }
support-fragment          = { group = "androidx.fragment",        name = "fragment",         version.ref = "fragment" }
support-recyclerview      = { group = "androidx.recyclerview",    name = "recyclerview",     version.ref = "recyclerView" }
support-constraintlayout  = { group = "androidx.constraintlayout",name = "constraintlayout", version.ref = "constraintLayout" }
support-interpolator      = { group = "androidx.interpolator",    name = "interpolator",     version.ref = "interpolator" }
support-design            = { group = "com.google.android.material", name = "material",      version.ref = "material" }
support-multidex          = { group = "androidx.multidex",        name = "multidex",         version.ref = "multidex" }
support-print             = { group = "androidx.print",           name = "print",            version.ref = "androidxPrint" }

# ---- 测试 ----
junit            = { group = "junit",                name = "junit",         version.ref = "junit" }
mockito          = { group = "org.mockito",          name = "mockito-core",  version.ref = "mockito" }
mockk            = { group = "io.mockk",             name = "mockk",         version.ref = "mockk" }
robolectric      = { group = "org.robolectric",      name = "robolectric",   version.ref = "robolectric" }
assertjcore      = { group = "org.assertj",          name = "assertj-core",  version.ref = "assertj" }
test-runner      = { group = "androidx.test.ext",    name = "junit",         version.ref = "testRunner" }
test-rules       = { group = "androidx.test",        name = "rules",         version.ref = "testRules" }
espresso-core    = { group = "androidx.test.espresso", name = "espresso-core",    version.ref = "espresso" }
espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator",  version.ref = "uiAutomator" }

# ---- 第三方 ----
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentryAndroid" }
app-center     = { group = "com.microsoft.appcenter", name = "espresso-test-extension", version.ref = "appcenter" }
commons-io     = { group = "commons-io",              name = "commons-io",   version.ref = "commonsIO" }
timber         = { group = "com.jakewharton.timber",  name = "timber",       version.ref = "timber" }
okhttp3        = { group = "com.squareup.okhttp3",    name = "okhttp",       version.ref = "okhttp" }
leak-canary    = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakCanary" }

# ---- 其它 ----
android-server-core    = { group = "com.github.fengzhizi715.AndroidServer", name = "core", version.ref = "androidServer" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit",     version = "1.3.0" }
androidx-test-core-ktx  = { group = "androidx.test",     name = "core-ktx",  version = "1.7.0" }
androidx-tracing        = { group = "androidx.tracing",  name = "tracing",   version = "1.3.0" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.11.0" }

# ---- Lint ----
lint        = { group = "com.android.tools.lint", name = "lint",        version.ref = "lint" }
lint-api    = { group = "com.android.tools.lint", name = "lint-api",    version.ref = "lint" }
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lint" }
lint-tests  = { group = "com.android.tools.lint", name = "lint-tests",  version.ref = "lint" }

blankj-utilCode    = { group = "com.blankj", name = "utilcodex",version.ref="utilcode"}

[plugins]
kotlinter              = { id = "org.jmailen.kotlinter", version = "5.4.2" }
dokka                  = { id = "org.jetbrains.dokka",    version = "2.2.0" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }